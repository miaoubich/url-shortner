server:
  port: 8080
  
spring:
 application:
  name: url-shortner-app
 
 threads:
  virtual:
   enabled: true
       
 datasource:
  url: jdbc:postgresql://localhost:5432/urlshortner
  username: ${SPRING_DATASOURCE_USERNAME:postgres}
  password:  ${SPRING_DATASOURCE_PASSWORD:password}
  hikari:
   maximum-pool-size: 20 #HikariCP will open at most 20 physical connections to PostgreSQL
   minimum-idle: 5 #physical PostgreSQL connections Hikari keeps open even when nobody is using the database
   #recycle connections periodically rather than holding them open forever, which helps catch/avoid subtly stale connections.
   idle-timeout: 300000 #If a connection sits idle (unused) for 5 minutes, HikariCP is allowed to close it.
   max-lifetime: 1800000 #A physical PostgreSQL connection will be closed and replaced every 30 minutes.
   connection-timeout: 3000 #How long a thread (virtual or platform) will wait for a DB connection from the Hikari pool before failing with an exception.
   pool-name: url-shortner-pool
   driver-class-name: org.postgresql.Driver
 jpa:
  open-in-view: false
  hibernate:
   ddl-auto: update
  show-sql: true 
  
 kafka:
  bootstrap-servers: localhost:9092
  producer:
   key-serializer: org.apache.kafka.common.serialization.StringSerializer
   # For Spring boot 4.x, you can use the following serializer for JSON serialization
   #value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
   value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
   acks: 1 #It ackowledge the producer that the leader broker wrotten the event
  consumer:
   group-id: analytics-service
   key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
   # For Spring Boot 4.x, you can use the following deserializer for JSON deserialization
   #value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
   value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
   properties:
    spring.json.trusted.packages: org.miaoubich.dto
    spring.json.value.default.type: org.miaoubich.dto.ClickEvent
    
resilience4j:
 circuitbreaker:
  instances:
    urlSafetyCheck:  # ← @CircuitBreaker(name = "urlSafetyCheck") reads THIS block
     sliding-window-size: 20
     slidingWindowType: COUNT_BASED
     failure-rate-threshold: 50
     registerHealthIndicator: true
     automaticTransitionFromOpenToHalfOpenEnabled: true
     waitDurationInOpenState: 5s
     permittedNumberOfCallsInHalfOpenState: 3
     minimumNumberOfCalls: 5
     eventConsumerBufferSize: 10
 timelimiter:
  instances:
    urlSafetyCheck:  # ← @TimeLimiter(name = "urlSafetyCheck") reads THIS block
     timeout-duration: 800ms
 retry:
  instances:
    urlSafetyCheck:  # ← @Retry(name = "urlSafetyCheck") reads THIS block
     max-attempts: 3
     wait-duration: 500ms
     
management:
 health:
  circuitbreakers: 
   enabled: true
 endpoints:
  web:
   exposure:
    include: health, metrics, prometheus, caches, circuitbreakers, circuitbreakerevents
 metrics:
  distribution:
   percentiles-histogram:
    httpServerRequests: true   
 endpoint:
  health:
   show-details: always 
   
logging:
 level:
  org.springframework.core.task: DEBUG

 
      
