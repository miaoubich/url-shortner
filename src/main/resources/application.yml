server:
  port: 8080
  
spring:
 application:
  name: url-shortner-app
 
 threads:
  virtual:
   enabled: true
       
 datasource:
  url: jdbc:postgresql://localhost:5432/urlshortner
  username: ${SPRING_DATASOURCE_USERNAME:postgres}
  password:  ${SPRING_DATASOURCE_PASSWORD:password}
 jpa:
  open-in-view: false
  hibernate:
   ddl-auto: update
  show-sql: true 
  
 kafka:
  bootstrap-servers: localhost:9092
  producer:
   key-serializer: org.apache.kafka.common.serialization.StringSerializer
   value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
   acks: 1 #It ackowledge the producer that the leader broker wrotten the event
  consumer:
   group-id: analytics-service
   key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
   value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
   properties:
    spring.json.trusted.packages: org.miaoubich.dto
    spring.json.value.default.type: org.miaoubich.dto.ClickEvent
    
resilience4j:
 circuitbreaker:
  instances:
    urlSafetyCheck:  # ← @CircuitBreaker(name = "urlSafetyCheck") reads THIS block
     sliding-window-size: 20
     slidingWindowType: COUNT_BASED
     failure-rate-threshold: 50
     registerHealthIndicator: true
     automaticTransitionFromOpenToHalfOpenEnabled: true
     waitDurationInOpenState: 5s
     permittedNumberOfCallsInHalfOpenState: 3
     minimumNumberOfCalls: 5
     eventConsumerBufferSize: 10
 timelimiter:
  instances:
    urlSafetyCheck:  # ← @TimeLimiter(name = "urlSafetyCheck") reads THIS block
     timeout-duration: 800ms
 retry:
  instances:
    urlSafetyCheck:  # ← @Retry(name = "urlSafetyCheck") reads THIS block
     max-attempts: 3
     wait-duration: 500ms
     
management:
 health:
  circuitbreakers: 
   enabled: true
 endpoints:
  web:
   exposure:
    include: health, metrics, prometheus, caches, circuitbreakers, circuitbreakerevents
 metrics:
  distribution:
   percentiles-histogram:
    httpServerRequests: true   
 endpoint:
  health:
   show-details: always 
   
logging:
 level:
  org.springframework.core.task: DEBUG

 
      
